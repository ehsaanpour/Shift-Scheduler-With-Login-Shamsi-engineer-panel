<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - برنامه‌ریز شیفت</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #198754 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
        }
        
        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header .logo {
            font-size: 3rem;
            color: #0d6efd;
            margin-bottom: 1rem;
        }
        
        .form-floating {
            margin-bottom: 1rem;
        }
        
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            font-size: 1.1rem;
            background: linear-gradient(90deg, #0d6efd 0%, #198754 100%);
            border: none;
        }
        
        .btn-login:hover {
            background: linear-gradient(90deg, #0b5ed7 0%, #157347 100%);
        }
        
        .error-message {
            color: #dc3545;
            text-align: center;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        
        .form-label-group {
            position: relative;
            margin-bottom: 1rem;
        }
        
        .form-label-group input {
            padding: 1rem 0.75rem;
            height: auto;
            padding-left: 30px;
        }
        
        .form-label-group i {
            position: absolute;
            left: 10px;
            right: auto;
            top: 14px;
            color: #6c757d;
        }
    </style>
</head>
<body dir="rtl">
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-calendar-alt"></i>
            </div>
            <h2>برنامه ریز شیفت</h2>
            <p class="text-muted">لطفا برای ادامه کار وارد شوید</p>
        </div>
        
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="post" action="/login">
            <div class="form-label-group">
                <input type="text" id="username" name="username" class="form-control" placeholder="نام کاربری" required autofocus>
                <i class="fas fa-user"></i>
            </div>
            
            <div class="form-label-group">
                <input type="password" id="password" name="password" class="form-control" placeholder="رمز عبور" required>
                <i class="fas fa-lock"></i>
            </div>
            
            <button class="btn btn-lg btn-primary btn-login" type="submit">
                <i class="fas fa-sign-in-alt me-2"></i> ورود
            </button>
        </form>
        
        <div class="mt-4 text-center text-muted">
            <small>Copyright 2025 این برنامه متن-باز توسط احسان احسانپور توسعه پیدا کرده است <a href="https://github.com/ehsaanpour/" target="_blank">@ehsaanpour</a></small> 
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
